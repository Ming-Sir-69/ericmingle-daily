<title>四时日报</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>
/* Layout: a journal of mornings. Today opens wide; the past week sits below as rows you can unfold; older days shrink into small status cards, like a photo wall you can glance at but not reopen. */
:root {
  --bg: #FCFCFB; --wash: #F6F5F1; --ink: #2E2C27; --ink-soft: #6B6A63; --ink-grey: #B4B3A8; --hairline: #E4E3DC;
  --clay: #C6613F; --clay-wash: #F6E4DA; --sage: #7C9A82; --sage-wash: #E4ECE5;
  --scene-filter: none;
  --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", "SimSun", Georgia, serif;
  --sans: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161A1D; --wash: #1D2125; --ink: #ECEAE2; --ink-soft: #A7A99F; --ink-grey: #5C5F58; --hairline: #2F3337;
    --clay: #DA7A5A; --clay-wash: #3A2A22; --sage: #94B39A; --sage-wash: #243028;
    --scene-filter: brightness(.72) saturate(.85); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161A1D; --wash: #1D2125; --ink: #ECEAE2; --ink-soft: #A7A99F; --ink-grey: #5C5F58; --hairline: #2F3337;
  --clay: #DA7A5A; --clay-wash: #3A2A22; --sage: #94B39A; --sage-wash: #243028;
  --scene-filter: brightness(.72) saturate(.85); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.65; }
a { color: inherit; }
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 72px;
  display: grid; gap: 44px;
}
.mast { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mast h1 { font-family: var(--serif); font-weight: 600; font-size: 26px; margin: 0; letter-spacing: .02em; }
.mast p { margin: 0; font-size: 13px; color: var(--ink-soft); }
h2 { font-size: 14px; font-weight: 600; letter-spacing: .06em; margin: 0 0 16px; color: var(--ink); }
.scene-mini { display: block; width: 100%; height: auto; filter: var(--scene-filter); }

/* today */
.today { display: grid; gap: 14px; }
.today .frame { border-radius: 14px; overflow: hidden; background: var(--wash); }
.dateline { font-size: 13px; color: var(--ink-soft); letter-spacing: .04em; margin: 0; }
.today h3 { font-family: var(--serif); font-weight: 600; font-size: 30px; line-height: 1.3; margin: 0; text-wrap: balance; word-break: keep-all; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.tags li { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--wash); color: var(--ink-soft); }
.open { justify-self: start; font: 500 14px var(--sans); color: #FFFFFF; background: var(--clay); text-decoration: none; padding: 9px 16px; border-radius: 8px; }
.open:hover { filter: brightness(.94); }

/* this week */
.week { display: grid; gap: 4px; }
.day { border-radius: 12px; transition: background .2s; }
.day[open] { background: var(--wash); }
.day > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 120px minmax(0, 1fr) 16px; gap: 14px; align-items: center; padding: 10px; border-radius: 12px; }
.day > summary::-webkit-details-marker { display: none; }
.day > summary:hover { background: var(--wash); }
.day .thumb { border-radius: 8px; overflow: hidden; background: var(--wash); }
.day .meta { min-width: 0; display: grid; gap: 4px; }
.day .meta b { font-size: 12px; font-weight: 500; color: var(--ink-soft); letter-spacing: .03em; }
.day .meta span { font-family: var(--serif); font-size: 17px; font-weight: 600; line-height: 1.35; }
.day .chev { color: var(--ink-grey); transition: transform .2s; }
.day[open] .chev { transform: rotate(90deg); color: var(--clay); }
.day .body { padding: 4px 14px 18px 144px; display: grid; gap: 16px; }
.day .body h4 { margin: 0 0 6px; font-size: 13px; color: var(--ink-soft); font-weight: 600; letter-spacing: .04em; }
.day .body ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.day .body li { font-size: 14px; }
.day .body li em { font-style: normal; color: var(--ink-soft); display: block; font-size: 13px; }
.day .body .full { font-size: 13px; color: var(--clay); text-decoration: none; }
.day .body .full:hover { text-decoration: underline; text-underline-offset: 3px; }
summary:focus-visible, a:focus-visible { outline: 2px solid var(--ink-soft); outline-offset: 2px; }

/* earlier */
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.card { display: grid; gap: 6px; align-content: start; min-width: 0; }
.card .thumb { border-radius: 10px; overflow: hidden; background: var(--wash); }
.card b { font-size: 12px; font-weight: 500; color: var(--ink-soft); }
.card span { font-size: 14px; line-height: 1.45; }
.card .tags li { font-size: 11px; padding: 1px 8px; }
.demo { font-size: 11px; color: var(--clay); border: 1px solid var(--clay); border-radius: 999px; padding: 0 6px; margin-left: 6px; }
.empty { color: var(--ink-soft); font-size: 14px; margin: 0; }
footer { font-size: 12px; color: var(--ink-grey); display: grid; gap: 4px; }

@media (max-width: 640px) {
  .today h3 { font-size: 24px; }
  .day > summary { grid-template-columns: 92px minmax(0, 1fr) 14px; gap: 10px; }
  .day .body { padding: 4px 12px 16px 12px; }
  .wall { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
}
</style>

<div class="wrap">
  <div class="mast">
    <h1>四时日报</h1>
    <p>Mingle 的每日晨间简报</p>
  </div>

{{TODAY}}

  <section>
    <h2>这一周</h2>
{{WEEK}}
  </section>

  <section>
    <h2>更早</h2>
{{EARLIER}}
  </section>

  <footer>
    <span>{{FOOTER}}</span>
  </footer>
</div>
