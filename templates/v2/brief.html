<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one valley that grows through the week. Monday is a quiet watercolor horizon; each day adds a layer until Sunday is a full painted sky. Season tints the leaves and hills, Luzhou's weather sets sun, clouds and rain, and a holiday adds one small token. A preview tuner on top switches all four. */
:root {
  --bg: #FCFCFB;
  --wash: #F9F9F7;
  --ink: #2E2C27;
  --ink-soft: #6B6A63;
  --ink-grey: #B4B3A8;
  --hairline: #E4E3DC;

  --clay: #C6613F; --clay-soft: #E3A587; --clay-wash: #F6E4DA;
  --sage: #7C9A82; --sage-soft: #A9C0AD; --sage-wash: #E4ECE5;
  --paper: #FFFFFF;

  --sky-top: #6FAEE0; --sky-mid: #A9D3F0; --sky-low: #EEF3E6;
  --overcast-color: #B9C3CB;
  --sun: #FFF1C2; --sun-core: #FFE59A;
  --cloud: #FFFFFF; --cloud-shade: #C6D7EA; --cloud-warm: #FFF0D9;
  --wind: rgba(255, 255, 255, .75);
  --rain: #7D93A8;
  --stars-op: 0; --night-op: 0; --night-tint: #1A2340;

  --mtn: #B4CDC5;
  --hill-far: #A8CB93; --hill-mid: #82B46A; --hill-near: #66A055;
  --grass: #A9D27A; --grass-dark: #4E8743;
  --leaf-dark: #3E7040; --leaf-mid: #5E9450; --leaf-light: #93C36E;
  --trunk: #6E5240; --path: #EFE3C4;
  --wall: #F6EFE2; --roof: #C8553A; --roof-dark: #8F3A28; --window: #F4C766;
  --sea: #6AA8CF; --stone: #ABA393;
  --flower-y: #F5D266; --flower-w: #FFFFFF; --blossom: #F3B9C6;
  --lantern: #D2402F; --gold: #F2C14E; --moon: #FBEBC0;
  --night-a: #2C3F6B; --night-b: #5C74A6; --star: #FBE3A0;
  --sa1: #F6E4DA; --sa2: #E3A587; --sa3: #C6613F; --sa-ray-op: 1;

  --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", "SimSun", Georgia, serif;
  --sans: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161A1D; --wash: #1C2024; --ink: #ECEAE2; --ink-soft: #A7A99F; --ink-grey: #5C5F58; --hairline: #33363A;
    --clay: #DA7A5A; --clay-soft: #9A5A42; --clay-wash: #3A2A22; --sage: #94B39A; --sage-soft: #5F7A64; --sage-wash: #243028; --paper: #2A2D31;
    --rain: #8FA3BD; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161A1D; --wash: #1C2024; --ink: #ECEAE2; --ink-soft: #A7A99F; --ink-grey: #5C5F58; --hairline: #33363A;
  --clay: #DA7A5A; --clay-soft: #9A5A42; --clay-wash: #3A2A22; --sage: #94B39A; --sage-soft: #5F7A64; --sage-wash: #243028; --paper: #2A2D31;
  --rain: #8FA3BD; color-scheme: dark;
  --sky-top: #121B33; --sky-mid: #22325A; --sky-low: #3B4868; --overcast-color: #2A3140;
  --sun: #E9E3C8; --sun-core: #F4EDD0; --cloud: #56658A; --cloud-shade: #3A4766; --cloud-warm: #6A7094;
  --wind: rgba(220, 228, 255, .25); --stars-op: 1; --night-op: .64;
  --night-a: #121B33; --night-b: #2E4372;
  --sa1: rgba(233, 227, 200, .14); --sa2: #CFC8A8; --sa3: #F4EDD0; --sa-ray-op: 0;
}
/* night: the painted sky gets a moon instead of a sun */

/* season palettes (ground colors; night is applied as an overlay) */
#brief[data-season="spring"] { --hill-far: #B7D69D; --hill-mid: #8FC073; --hill-near: #74AA5C; --grass: #B9DC88; --leaf-dark: #4F8A4A; --leaf-mid: #7DB063; --leaf-light: #B3D88A; --mtn: #BBD3CB; }
#brief[data-season="autumn"] { --hill-far: #C9C48F; --hill-mid: #A8B06A; --hill-near: #8E9F55; --grass: #CFC77F; --grass-dark: #6E7A3E; --leaf-dark: #B0602C; --leaf-mid: #D88B3C; --leaf-light: #EDB766; --mtn: #C3C9BC; --sage-soft: #D9B58A; }
#brief[data-season="winter"] { --hill-far: #BAC3B4; --hill-mid: #9FAB99; --hill-near: #8B9985; --grass: #B6BEA9; --grass-dark: #66705F; --leaf-dark: #5E6E5C; --leaf-mid: #7F8E7A; --leaf-light: #A7B2A1; --mtn: #C6CFD2; --flower-y: #E6DCC0; }

/* weather */
#brief { --sky-op: 0; --overcast-op: 0; --sun-op: 1; --amp: 7deg; --tree-amp: 1.5deg; --cloud-dur: 40s; --cloud-filter: none; }
#brief[data-weather="cloudy"] { --overcast-op: .6; --sun-op: .3; --cloud-filter: saturate(.5) brightness(.95); }
#brief[data-weather="rain"] { --overcast-op: .78; --sun-op: 0; --cloud-filter: saturate(.3) brightness(.86); --amp: 10deg; }
#brief[data-weather="windy"] { --overcast-op: .2; --amp: 20deg; --tree-amp: 4deg; --cloud-dur: 11s; }

/* weekday richness */
#brief[data-level="1"] { --sky-op: 0; }
#brief[data-level="2"] { --sky-op: .14; }
#brief[data-level="3"] { --sky-op: .32; }
#brief[data-level="4"] { --sky-op: .6; }
#brief[data-level="5"] { --sky-op: .8; }
#brief[data-level="6"] { --sky-op: .93; }
#brief[data-level="7"] { --sky-op: 1; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.65; }
a { color: inherit; }
svg { display: block; max-width: 100%; overflow: visible; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.inner {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- preview tuner ---------- */
.tuner { background: var(--wash); border-bottom: 1px solid var(--hairline); }
.tuner .inner { padding-block: 14px; display: grid; gap: 8px; }
.tuner-note { margin: 0 0 2px; font-size: 12px; color: var(--ink-soft); }
.tuner-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tuner-row > span { font-size: 12px; color: var(--ink-soft); width: 34px; flex: none; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button {
  font: 500 13px var(--sans); color: var(--ink); background: transparent;
  border: 1px solid var(--hairline); border-radius: 7px; padding: 4px 11px; cursor: pointer;
  transition: background .2s, color .2s, border-color .2s;
}
.seg button:hover { border-color: var(--ink-grey); }
.seg button[aria-pressed="true"] { background: var(--clay); border-color: var(--clay); color: #FFFFFF; }
.seg button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.seg button small { font-size: 11px; opacity: .75; margin-left: 3px; }


/* ---------- back link ---------- */
.back { position: absolute; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px)); font-size: 13px; color: var(--ink); opacity: .7; text-decoration: none; }
.back:hover { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
#brief { position: relative; }
.lightbtn { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); z-index: 3; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--hairline); background: color-mix(in srgb, var(--bg) 70%, transparent); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.lightbtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.lightbtn .i-moon { display: none; }
:root[data-theme="dark"] .lightbtn .i-sun { display: none; }
:root[data-theme="dark"] .lightbtn .i-moon { display: block; }
.sky-layer, .overcast, .sky, h1, .dateline { transition: background .9s ease, color .9s ease, opacity .9s ease; }


.bat { fill: #070B18; }
.ff-core { fill: #FBFFD0; }
.ff-float { animation: ff-float 7s ease-in-out infinite; }
.ff-blink { animation: ff-blink 2.6s ease-in-out infinite; }
@keyframes ff-float { 0%,100% { transform: translate(0,0); } 25% { transform: translate(9px,-7px); } 50% { transform: translate(-4px,-14px); } 75% { transform: translate(-10px,-5px); } }
@keyframes ff-blink { 0%,100% { opacity: .15; } 45%,60% { opacity: 1; } }
body, .page h2, .page h3, .item p, .item-title, .calm, .lightbtn { transition: color 1.2s ease, background-color 1.2s ease, border-color 1.2s ease; }
.dateline, h1 { transition: color .45s ease; }


/* lower page: its own day/night palette so the small paintings stay readable on the page background */
.ui-day, .ui-night { transition: opacity 1.2s ease; }
.ui-night { opacity: 0; }
:root[data-theme="dark"] .ui-night { opacity: 1; }
:root[data-theme="dark"] .ui-day { opacity: 0; }
.ui-bat { fill: var(--ink-soft); }
.pg-cloud { fill: #FFFFFF; }
.page { --cloud: #E2E9F1; --cloud-shade: #BCC9D8; --cloud-warm: #F3E3CF; --flower-w: #C9C2AE; }
:root[data-theme="dark"] .page { --cloud: #56658A; --cloud-shade: #3A4766; --cloud-warm: #6A7094; --flower-w: #EDEBE3; }
.page .f-sea { fill: #5E9EC6; }

/* ---------- header scene ---------- */
.sky { position: relative; overflow: hidden; background: linear-gradient(to bottom, var(--wash) 0%, var(--wash) 55%, var(--bg) 100%); }
.sky-layer, .overcast { position: absolute; inset: 0; pointer-events: none; transition: opacity 1s ease; }
.sky-layer { background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-low) 82%, var(--bg) 100%); opacity: var(--sky-op); }
.overcast { background: linear-gradient(to bottom, var(--overcast-color) 0%, transparent 85%); opacity: calc(var(--overcast-op) * (0.35 + var(--sky-op) * 0.65)); }
.sky .inner { position: relative; z-index: 1; padding-block: 44px 0; }
.dateline { color: var(--ink); opacity: .72; font-size: 13px; letter-spacing: 0.04em; margin: 0 0 12px; }
h1 { font-family: var(--serif); font-weight: 600; font-size: 40px; line-height: 1.25; margin: 0; color: var(--ink); text-wrap: balance; word-break: keep-all; }
.scene { position: relative; z-index: 1; width: 100%; height: clamp(170px, 22vw, 240px); margin-top: -6px; transition: height 1s ease, margin 1s ease; }
#brief[data-level="4"] .scene, #brief[data-level="5"] .scene, #brief[data-level="6"] .scene, #brief[data-level="7"] .scene { height: clamp(230px, 34vw, 360px); margin-top: -40px; }

.acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; padding-block: 6px 8px; }
.act { min-width: 0; }
.act b { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.act p { margin: 0; color: var(--ink-soft); font-size: 14px; }

/* ---------- content ---------- */
.page .inner { padding-block: 8px 72px; display: grid; gap: 28px; }
.sec-head { display: flex; align-items: center; gap: 12px; margin: 0 0 20px; }
.sec-icon { position: relative; width: 50px; height: 50px; flex: none; }
.sec-icon svg { position: absolute; inset: 0; width: 50px; height: 50px; }
h2 { font-size: 15px; font-weight: 600; letter-spacing: 0.06em; margin: 0; }
h3 { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; margin: 26px 0 14px; color: var(--ink-soft); }
.sec-head + h3 { margin-top: 0; }
ol.items { list-style: none; counter-reset: n; padding: 0; margin: 0; display: grid; gap: 24px; }
ol.items li { counter-increment: n; display: grid; grid-template-columns: 28px minmax(0, 1fr); }
ol.items li::before { content: counter(n); color: var(--ink-grey); font-variant-numeric: tabular-nums; font-size: 13px; padding-top: 2px; }
.item-title { display: block; font-weight: 600; font-size: 15px; color: var(--ink); text-decoration: none; margin-bottom: 4px; }
a.item-title:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--clay); }
.item p { margin: 0; color: var(--ink-soft); font-size: 14px; }
.item a.src { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--ink-grey); color: var(--ink-soft); }
.item .impact { margin-top: 8px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
.item .impact::before { content: "影响"; color: var(--ink); font-weight: 600; font-size: 13px; padding-top: 1px; }
.calm { color: var(--ink-soft); font-size: 14px; margin: 0; }
.calm.after { margin-top: 20px; }
.divider { position: relative; display: grid; justify-items: center; }
.divider svg { grid-area: 1 / 1; width: 280px; height: auto; }
a:focus-visible { outline: 2px solid var(--ink-soft); outline-offset: 3px; border-radius: 2px; }

/* ---------- fills / strokes ---------- */
.w-clay { fill: var(--clay); } .w-clay-soft { fill: var(--clay-soft); } .w-clay-wash { fill: var(--clay-wash); }
.w-sage { fill: var(--sage); } .w-sage-soft { fill: var(--sage-soft); } .w-sage-wash { fill: var(--sage-wash); }
.w-paper { fill: var(--paper); } .w-grey { fill: var(--ink-grey); } .w-ink { fill: var(--ink); }
.ln { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ln-2 { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ln-sage { fill: none; stroke: var(--sage); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ln-clay { fill: none; stroke: var(--clay); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ln-grey { fill: none; stroke: var(--ink-grey); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
.f-cloud { fill: var(--cloud); } .f-cloud-shade { fill: var(--cloud-shade); } .f-cloud-warm { fill: var(--cloud-warm); }
.f-mtn { fill: var(--mtn); } .f-hill-far { fill: var(--hill-far); } .f-hill-mid { fill: var(--hill-mid); } .f-hill-near { fill: var(--hill-near); }
.f-leaf-dark { fill: var(--leaf-dark); } .f-leaf-mid { fill: var(--leaf-mid); } .f-leaf-light { fill: var(--leaf-light); }
.f-trunk { fill: var(--trunk); } .f-wall { fill: var(--wall); } .f-roof { fill: var(--roof); } .f-roof-dark { fill: var(--roof-dark); }
.f-window { fill: var(--window); } .f-sea { fill: var(--sea); } .f-stone { fill: var(--stone); }
.f-flower-y { fill: var(--flower-y); } .f-flower-w { fill: var(--flower-w); } .f-blossom { fill: var(--blossom); }
.f-sun-core { fill: var(--sun-core); } .f-star { fill: var(--star); } .f-lantern { fill: var(--lantern); } .f-gold { fill: var(--gold); } .f-moon { fill: var(--moon); }
.f-grass-dark { fill: var(--grass-dark); }
.sa1 { fill: var(--sa1); } .sa2 { fill: var(--sa2); } .sa3 { fill: var(--sa3); }
.sa-ray { fill: none; stroke: var(--sa3); stroke-width: 1.6; stroke-linecap: round; opacity: var(--sa-ray-op); }
.s-grass { fill: none; stroke: var(--grass); stroke-width: 2; stroke-linecap: round; }
.s-grass-dark { fill: none; stroke: var(--grass-dark); stroke-width: 1.6; stroke-linecap: round; }
.s-trunk { fill: none; stroke: var(--trunk); stroke-width: 3; stroke-linecap: round; }
.s-ink { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.s-white { fill: none; stroke: var(--flower-w); stroke-width: 1.2; stroke-linecap: round; }
.s-wind { fill: none; stroke: var(--wind); stroke-width: 2; stroke-linecap: round; }
.s-path { fill: none; stroke: var(--path); stroke-linecap: round; }
.s-rain { fill: none; stroke: var(--rain); stroke-width: 1.3; stroke-linecap: round; }
.s-gold { fill: none; stroke: var(--gold); stroke-width: 1.4; stroke-linecap: round; }
.wc { filter: url(#wc); } .wc-s { filter: url(#wc-s); }
.stars { opacity: var(--stars-op); }
.night { opacity: var(--night-op); mix-blend-mode: multiply; }
.stop-night-t0 { stop-color: var(--night-tint); stop-opacity: 0; } .stop-night-t1 { stop-color: var(--night-tint); stop-opacity: 1; }
.sun-op { opacity: var(--sun-op); transition: opacity 1s ease; }
.clouds { filter: var(--cloud-filter); transition: filter 1s ease; }
.stop-sun-a { stop-color: var(--sun); stop-opacity: .95; } .stop-sun-b { stop-color: var(--sun); stop-opacity: 0; }
.stop-moon-a { stop-color: var(--moon); stop-opacity: .8; } .stop-moon-b { stop-color: var(--moon); stop-opacity: 0; }
.stop-fade-a { stop-color: var(--bg); stop-opacity: 0; } .stop-fade-b { stop-color: var(--bg); stop-opacity: 1; }
.stop-sky-a { stop-color: var(--sky-mid); } .stop-sky-b { stop-color: var(--sky-low); }
.stop-night-a { stop-color: var(--night-a); } .stop-night-b { stop-color: var(--night-b); }

/* ---------- layer switching ---------- */
.lv, .opt { transition: opacity .9s ease, visibility .9s; }
.opt { opacity: 0; visibility: hidden; }
#brief[data-season="spring"] .s-spring, #brief[data-season="summer"] .s-summer,
#brief[data-season="autumn"] .s-autumn, #brief[data-season="winter"] .s-winter,
#brief[data-weather="sunny"] .x-sunny,
#brief[data-weather="partly"] .x-clouds, #brief[data-weather="cloudy"] .x-clouds, #brief[data-weather="rain"] .x-clouds, #brief[data-weather="windy"] .x-clouds,
#brief[data-weather="cloudy"] .x-overcast, #brief[data-weather="rain"] .x-overcast,
#brief[data-weather="rain"] .x-rain, #brief[data-weather="windy"] .x-windy,
#brief[data-holiday="midautumn"] .h-midautumn, #brief[data-holiday="newyear"] .h-newyear, #brief[data-holiday="lunar"] .h-lunar,
#brief[data-holiday="midautumn"] .h-lantern, #brief[data-holiday="lunar"] .h-lantern { opacity: 1; visibility: visible; }
#brief[data-level="1"] .f2,
#brief[data-level="1"] .f3,
#brief[data-level="1"] .f4,
#brief[data-level="1"] .f5,
#brief[data-level="1"] .f6,
#brief[data-level="1"] .f7 { opacity: 0; visibility: hidden; }
#brief[data-level="2"] .f3,
#brief[data-level="2"] .f4,
#brief[data-level="2"] .f5,
#brief[data-level="2"] .f6,
#brief[data-level="2"] .f7,
#brief[data-level="2"] .u1 { opacity: 0; visibility: hidden; }
#brief[data-level="3"] .f4,
#brief[data-level="3"] .f5,
#brief[data-level="3"] .f6,
#brief[data-level="3"] .f7,
#brief[data-level="3"] .u1,
#brief[data-level="3"] .u2 { opacity: 0; visibility: hidden; }
#brief[data-level="4"] .f5,
#brief[data-level="4"] .f6,
#brief[data-level="4"] .f7,
#brief[data-level="4"] .u1,
#brief[data-level="4"] .u2,
#brief[data-level="4"] .u3 { opacity: 0; visibility: hidden; }
#brief[data-level="5"] .f6,
#brief[data-level="5"] .f7,
#brief[data-level="5"] .u1,
#brief[data-level="5"] .u2,
#brief[data-level="5"] .u3,
#brief[data-level="5"] .u4 { opacity: 0; visibility: hidden; }
#brief[data-level="6"] .f7,
#brief[data-level="6"] .u1,
#brief[data-level="6"] .u2,
#brief[data-level="6"] .u3,
#brief[data-level="6"] .u4,
#brief[data-level="6"] .u5 { opacity: 0; visibility: hidden; }
#brief[data-level="7"] .u1,
#brief[data-level="7"] .u2,
#brief[data-level="7"] .u3,
#brief[data-level="7"] .u4,
#brief[data-level="7"] .u5,
#brief[data-level="7"] .u6 { opacity: 0; visibility: hidden; }
.lantern-body { fill: var(--lantern-c, var(--lantern)); }
#brief[data-holiday="midautumn"] { --lantern-c: #E8833A; }

/* ---------- motion ---------- */
.a-rays { transform-box: view-box; transform-origin: 400px 230px; animation: spin 12s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.a-halo { transform-box: fill-box; transform-origin: center; animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.12); opacity: 1; } }
.glow { transform-box: fill-box; transform-origin: center; animation: glow 5s ease-in-out infinite; }
@keyframes glow { 0%,100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.08); opacity: 1; } }
.drift-a { animation: drift-a var(--cloud-dur) ease-in-out infinite; }
.drift-b { animation: drift-b calc(var(--cloud-dur) * .75) ease-in-out infinite; }
.drift-c { animation: drift-a calc(var(--cloud-dur) * .6) ease-in-out infinite reverse; }
@keyframes drift-a { 0%,100% { transform: translateX(-30px); } 50% { transform: translateX(40px); } }
@keyframes drift-b { 0%,100% { transform: translateX(30px); } 50% { transform: translateX(-36px); } }
.wind { stroke-dasharray: 70 600; animation: wind 6s linear infinite; }
.wind.w2 { animation-duration: 8s; animation-delay: -3s; }
@keyframes wind { from { stroke-dashoffset: 670; } to { stroke-dashoffset: 0; } }
.canopy { transform-box: view-box; transform-origin: 470px 300px; animation: canopy 4.5s ease-in-out infinite; }
.small-tree { transform-box: view-box; transform-origin: 900px 302px; animation: canopy 3.2s ease-in-out infinite; }
@keyframes canopy { 0%,100% { transform: rotate(calc(var(--tree-amp) * -1)); } 50% { transform: rotate(var(--tree-amp)); } }
.blade { transform-box: fill-box; transform-origin: 50% 100%; animation: blade 2.2s ease-in-out infinite; }
.blade.d1 { animation-delay: -.5s; animation-duration: 2.5s; }
.blade.d2 { animation-delay: -1.1s; animation-duration: 1.9s; }
.blade.d3 { animation-delay: -1.6s; animation-duration: 2.8s; }
@keyframes blade { 0%,100% { transform: rotate(calc(var(--amp) * -1)) skewX(-4deg); } 50% { transform: rotate(var(--amp)) skewX(5deg); } }
.glide { animation: glide 26s linear infinite; }
.glide.g2 { animation-duration: 32s; animation-delay: -11s; }
.glide.g3 { animation-duration: 29s; animation-delay: -20s; }
@keyframes glide { 0% { transform: translate(-120px, 0); } 50% { transform: translate(600px, -10px); } 100% { transform: translate(1340px, 0); } }
.wing-l { transform-box: fill-box; transform-origin: 100% 100%; animation: beat-l .6s ease-in-out infinite; }
.wing-r { transform-box: fill-box; transform-origin: 0% 100%; animation: beat-r .6s ease-in-out infinite; }
.slow .wing-l, .slow .wing-r { animation-duration: .76s; }
@keyframes beat-l { 0%,100% { transform: rotate(-38deg); } 50% { transform: rotate(26deg); } }
@keyframes beat-r { 0%,100% { transform: rotate(38deg); } 50% { transform: rotate(-26deg); } }
.smoke { animation: smoke 4s ease-out infinite; }
.smoke.s2 { animation-delay: -2s; }
@keyframes smoke { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 25% { opacity: .8; } 100% { transform: translate(14px, -26px) scale(1.4); opacity: 0; } }
.twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
.twinkle.t2 { animation-delay: -1s; animation-duration: 2s; }
.twinkle.t3 { animation-delay: -1.7s; animation-duration: 3.2s; }
@keyframes twinkle { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.6); opacity: .55; } }
.fall { animation: fall 5s ease-in infinite; }
.fall.f2 { animation-delay: -1.8s; animation-duration: 6s; }
.fall.f3 { animation-delay: -3.4s; animation-duration: 4.4s; }
@keyframes fall { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(-46px, 70px) rotate(220deg); opacity: 0; } }
.fall-s { animation: fall-s 4s ease-in infinite; }
.fall-s.f2 { animation-delay: -2s; }
@keyframes fall-s { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(-18px, 22px) rotate(200deg); opacity: 0; } }
.blow { animation: blow 5s linear infinite; }
.blow.b2 { animation-delay: -2.2s; animation-duration: 6.5s; }
.blow.b3 { animation-delay: -4s; animation-duration: 4.2s; }
@keyframes blow { 0% { transform: translate(-80px, 0) rotate(0); } 50% { transform: translate(560px, -40px) rotate(360deg); } 100% { transform: translate(1300px, 10px) rotate(720deg); } }
.drop { animation: drop .9s linear infinite; }
@keyframes drop { 0% { transform: translate(0, -30px); opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(-9px, 34px); opacity: 0; } }
.swing { transform-box: fill-box; transform-origin: 50% 0%; animation: swing 3s ease-in-out infinite; }
@keyframes swing { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.burst { transform-box: fill-box; transform-origin: center; animation: burst 2.4s ease-out infinite; }
.burst.k2 { animation-delay: -1.2s; animation-duration: 2.8s; }
@keyframes burst { 0% { transform: scale(.1); opacity: 0; } 15% { opacity: 1; } 70% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.1); opacity: 0; } }
.kite { animation: kite 4s ease-in-out infinite; }
@keyframes kite { 0%,100% { transform: translate(0, 0) rotate(-4deg); } 50% { transform: translate(10px, -8px) rotate(5deg); } }

/* section icons */
.a-beam { transform-box: view-box; transform-origin: 23px 13px; animation: beam-a 3.4s ease-in-out infinite; }
@keyframes beam-a { 0%,100% { transform: rotate(-40deg); opacity: .5; } 50% { transform: rotate(32deg); opacity: 1; } }
.b-beam { transform-box: view-box; transform-origin: 25px 14px; animation: beam-b 3.4s ease-in-out infinite; }
@keyframes beam-b { 0%,100% { transform: rotate(-40deg); opacity: .45; } 50% { transform: rotate(30deg); opacity: .95; } }
.seal { transform-box: fill-box; transform-origin: center; animation: seal 2.4s ease-in-out infinite; }
@keyframes seal { 0%,100% { transform: scale(1); } 50% { transform: scale(1.16); } }
.needle { transform-box: view-box; transform-origin: 23px 23px; animation: needle 4.4s ease-in-out infinite; }
@keyframes needle { 0%,100% { transform: rotate(-24deg); } 30% { transform: rotate(20deg); } 55% { transform: rotate(-8deg); } 75% { transform: rotate(5deg); } }
.blades { transform-box: view-box; transform-origin: 24px 19px; animation: spin 6s linear infinite; }
.bob { animation: bob 3s ease-in-out infinite; }
.bob.b1 { animation-delay: -1s; } .bob.b2 { animation-delay: -2s; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
.a-ripple { animation: a-ripple 3.6s ease-in-out infinite; }
@keyframes a-ripple { 0%,100% { transform: translateX(-4px); opacity: .6; } 50% { transform: translateX(4px); opacity: 1; } }
.b-ripple { animation: b-ripple 3.2s ease-in-out infinite; }
.b-ripple.r2 { animation-delay: -1.6s; }
@keyframes b-ripple { 0%,100% { transform: translateX(-6px); opacity: .4; } 50% { transform: translateX(6px); opacity: 1; } }
.wave { animation: wave 3s ease-in-out infinite; }
@keyframes wave { 0%,100% { transform: translateX(-2px); } 50% { transform: translateX(2px); } }
.shoot { animation: shoot 3.6s ease-in-out infinite; }
@keyframes shoot { 0%,100% { transform: translate(0, 0); } 50% { transform: translate(-2px, 2px); } }
.a-drift { animation: a-drift 14s ease-in-out infinite; }
@keyframes a-drift { 0%,100% { transform: translateX(-26px); } 50% { transform: translateX(26px); } }
.sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 2.2s ease-in-out infinite; }
.sway.d1 { animation-delay: -.6s; animation-duration: 2.6s; }
.sway.d2 { animation-delay: -1.3s; animation-duration: 1.9s; }
@keyframes sway { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.puff { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 3s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
  .wind { opacity: 0; }
  .drop, .fall, .fall-s, .blow, .burst { display: none; }
}
@media (max-width: 640px) {
  h1 { font-size: 30px; }
  .sky .inner { padding-top: 30px; }
  #brief[data-level="4"] .scene, #brief[data-level="5"] .scene, #brief[data-level="6"] .scene, #brief[data-level="7"] .scene { margin-top: -10px; }
  .acts { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .divider svg { width: 230px; }
}
</style>

<script>
(function () {
  var root = document.documentElement, brief = document.getElementById('brief'), btn = document.getElementById('lightbtn');
  var $ = function (id) { return document.getElementById(id); };
  var sunA = $('sunA'), sunB = $('sunB'), moon = $('tmoon'), birds = $('birds'), bats = $('bats'), ff = $('fireflies');
  var DAY = ['#6FAEE0','#A9D3F0','#EEF3E6','#B9C3CB','#FFF1C2','#FFE59A','#FFFFFF','#C6D7EA','#FFF0D9'];
  var DUSK= ['#3E4F8A','#C9708A','#F6A26E','#8E7C90','#FF9F6A','#FF8A4A','#F7B8A8','#9C7A9A','#FFB08A'];
  var NGT = ['#121B33','#22325A','#3B4868','#2A3140','#E9E3C8','#F4EDD0','#56658A','#3A4766','#6A7094'];
  var V = ['--sky-top','--sky-mid','--sky-low','--overcast-color','--sun','--sun-core','--cloud','--cloud-shade','--cloud-warm'];
  var LV = {1:0,2:.14,3:.32,4:.6,5:.8,6:.93,7:1}, WS = {sunny:1, partly:1, cloudy:.3, rain:0, windy:1};
  function rgb(h){ return [1,3,5].map(function(i){ return parseInt(h.substr(i,2),16); }); }
  function mix(a,b,t){ var x=rgb(a), y=rgb(b); return 'rgb('+x.map(function(v,i){ return Math.round(v+(y[i]-v)*t); }).join(',')+')'; }
  function ease(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
  function clamp(v){ return Math.max(0, Math.min(1, v)); }
  // One sky wheel: sun and moon sit opposite each other on a circle whose centre is below the horizon.
  // Time only moves forward, so every toggle turns the wheel 180 degrees clockwise (east -> overhead -> west).
  var CX = 600, CY = 480, R = 360, HORIZON = 300;
  var REST = Math.atan2(181 - CY, 400 - CX);          // the sun's daytime spot, left of centre
  function at(a) { return [CX + R * Math.cos(a), CY + R * Math.sin(a)]; }
  function paint(a) {
    var w = WS[brief.getAttribute('data-weather')]; if (w === undefined) w = 1;
    var sp = at(a), mp = at(a + Math.PI);
    var elev = (HORIZON - sp[1]) / 180;                  // 1 high in the sky, 0 on the horizon, negative below
    var d = clamp((0.45 - elev) / 0.8);                  // 0 day ... 1 night, follows the sun's height
    var col = d < .5 ? V.map(function(_,i){ return mix(DAY[i], DUSK[i], d*2); }) : V.map(function(_,i){ return mix(DUSK[i], NGT[i], d*2-1); });
    V.forEach(function (v,i) { brief.style.setProperty(v, col[i]); });
    var lv = LV[brief.getAttribute('data-level')] || .6;
    brief.style.setProperty('--sky-op', (lv + (1 - lv) * clamp(d * 1.6)).toFixed(3));
    brief.style.setProperty('--night-op', (.64 * d).toFixed(3));
    brief.style.setProperty('--stars-op', clamp((d - .55) / .45).toFixed(3));
    sunA.setAttribute('transform', 'translate(' + (sp[0] - 400).toFixed(1) + ' ' + (sp[1] - 230).toFixed(1) + ')');
    sunB.setAttribute('transform', 'translate(' + (sp[0] - 400).toFixed(1) + ' ' + (sp[1] - 120).toFixed(1) + ')');
    brief.style.setProperty('--sun-op', (w * clamp((HORIZON + 10 - sp[1]) / 50)).toFixed(3));
    moon.setAttribute('transform', 'translate(' + (mp[0] - 760).toFixed(1) + ' ' + (mp[1] - 150).toFixed(1) + ')');
    moon.style.opacity = (clamp((HORIZON + 10 - mp[1]) / 50) * (w === 0 ? .35 : 1)).toFixed(3);
    birds.style.opacity = clamp(1 - d * 2).toFixed(3);
    bats.style.opacity = clamp(d * 2 - 1).toFixed(3);
    ff.style.opacity = clamp((d - .6) / .4).toFixed(3);
    root.setAttribute('data-theme', d > .5 ? 'dark' : 'light');
    btn.setAttribute('aria-label', d > .5 ? '切换到白天' : '切换到夜晚');
  }
  var ang, raf = 0, manual = false;
  function isNight() { return Math.cos(ang - REST) < 0; }
  function turn(ms) {
    cancelAnimationFrame(raf);
    var from = ang, to = Math.round((ang - REST) / Math.PI) * Math.PI + REST + Math.PI, t0 = performance.now();
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) ms = 0;
    (function step(now) {
      var k = ms ? Math.min(1, (now - t0) / ms) : 1;
      ang = from + (to - from) * ease(k); paint(ang);
      if (k < 1) raf = requestAnimationFrame(step);
    })(t0);
  }
  function clockNight() { var h = new Date().getHours(); return !(h >= 6 && h < 18); }
  ang = REST + (clockNight() ? Math.PI : 0); paint(ang);
  setInterval(function () { if (!manual && clockNight() !== isNight()) turn(4200); }, 60000);
  btn.addEventListener('click', function () { manual = true; turn(4200); });
})();
</script>
